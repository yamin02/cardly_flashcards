<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f6f2">
<title>Cardly — study, one card at a time</title>
<style>
:root{--paper:#f7f6f2;--ink:#20231f;--muted:#777b72;--line:#e8e7df;--green:#375c4b;--lime:#d6ef83;--white:#fff;--shadow:0 24px 70px #252b2012}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1120px;margin:auto;padding:26px 42px 40px}.topbar{display:flex;align-items:center;justify-content:space-between;padding-bottom:24px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;font-weight:750;letter-spacing:-.04em;font-size:19px}.brand-mark{width:31px;height:31px;border-radius:10px;background:var(--green);display:grid;place-items:center;color:var(--lime);font-size:17px}.top-right{display:flex;align-items:center;gap:16px;color:var(--muted);font-size:13px}.upload-btn,.primary{border:0;background:var(--green);color:white;border-radius:11px;padding:11px 16px;font-weight:650;transition:.2s}.upload-btn:hover,.primary:hover{background:#294839;transform:translateY(-1px)}.upload-btn span{color:var(--lime);margin-right:6px}.hero{max-width:650px;margin:54px auto 34px;text-align:center}.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--green);font-weight:750}.hero h1{font-size:clamp(32px,5vw,48px);line-height:1.08;letter-spacing:-.055em;margin:12px 0}.hero p{color:var(--muted);margin:0 auto;max-width:480px}.workspace{max-width:790px;margin:auto}.study-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.deck-name{font-size:14px;font-weight:700}.deck-meta{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:8px}.quiet-btn{background:transparent;border:1px solid var(--line);border-radius:9px;padding:8px 11px;color:#54584f;font-size:12px;font-weight:600}.quiet-btn:hover{border-color:#b7baaf;background:#fff}.progress-wrap{height:4px;background:#e8e8e0;border-radius:4px;margin-bottom:19px;overflow:hidden}.progress{height:100%;background:var(--green);width:0%;transition:width .3s}.card-scene{perspective:1200px;min-height:345px;cursor:pointer;outline:none}.flashcard{position:relative;min-height:345px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.7,.2,1);border-radius:22px}.card-scene.flipped .flashcard{transform:rotateX(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);border-radius:22px;background:var(--white);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 75px}.back{transform:rotateX(180deg);background:#f1f4ed}.face-label{position:absolute;top:24px;left:28px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.13em;font-size:10px;font-weight:750;color:var(--muted)}.face-label:before{content:"";width:7px;height:7px;border-radius:50%;background:#a6aa9d}.back .face-label:before{background:var(--green)}.card-text{font-size:clamp(21px,3.4vw,31px);line-height:1.3;letter-spacing:-.035em;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere;max-height:210px;overflow:auto}.card-hint{position:absolute;bottom:22px;color:#9a9c94;font-size:11px}.controls{display:flex;align-items:center;justify-content:center;gap:19px;margin:19px 0 0}.arrow{width:43px;height:43px;border:1px solid var(--line);border-radius:50%;background:transparent;color:#454a43;font-size:19px;display:grid;place-items:center}.arrow:hover:not(:disabled){background:#fff;border-color:#c5c8bd}.arrow:disabled{opacity:.35;cursor:default}.counter{font-variant-numeric:tabular-nums;color:#777b72;font-size:13px;min-width:66px;text-align:center}.kbd-hint{text-align:center;color:#a0a198;font-size:11px;margin-top:24px}.kbd{display:inline-block;border:1px solid #d9d9d1;background:#fff;border-radius:4px;padding:0 5px;color:#73776d;font-size:10px;margin:0 2px}.drop-overlay{display:none;position:fixed;inset:16px;border:2px dashed var(--green);border-radius:20px;background:#f7f6f2ed;z-index:5;place-items:center;text-align:center;color:var(--green);font-size:24px;font-weight:700}.drop-overlay.show{display:grid}.empty{max-width:700px;margin:64px auto;padding:54px 34px;background:#fff;border:1px solid var(--line);border-radius:22px;text-align:center;box-shadow:var(--shadow)}.empty-icon{margin:0 auto 18px;width:58px;height:58px;border-radius:18px;background:#eef2e7;color:var(--green);display:grid;place-items:center;font-size:25px}.empty h2{font-size:24px;letter-spacing:-.04em;margin:0 0 8px}.empty p{color:var(--muted);max-width:410px;margin:0 auto 22px}.sample-link{border:0;background:none;color:var(--green);text-decoration:underline;text-underline-offset:3px;font-weight:600;margin-top:13px}.setup{max-width:590px;margin:32px auto;padding:27px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.setup h2{font-size:18px;margin:0 0 5px;letter-spacing:-.03em}.setup p{color:var(--muted);font-size:13px;margin:0 0 18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:11px;font-weight:700;color:#686d64;margin-bottom:5px}.field select,.field input[type=text]{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;color:var(--ink)}.setup-foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.checkbox{font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:center}.footer{max-width:790px;margin:58px auto 0;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:#9a9c94;font-size:11px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;transition:.2s;background:#20231f;color:#fff;border-radius:10px;padding:11px 16px;font-size:13px;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:650px){.shell{padding:18px 18px 30px}.topbar{padding-bottom:17px}.top-right .tagline{display:none}.hero{margin:40px auto 27px}.face{padding:43px 25px}.card-scene,.flashcard{min-height:330px}.study-head{align-items:flex-start;gap:12px}.actions{gap:5px}.quiet-btn{padding:7px 8px}.footer{margin-top:42px}.fields{grid-template-columns:1fr}.setup{padding:22px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar"><div class="brand"><div class="brand-mark">✳</div>cardly</div><div class="top-right"><span class="tagline">A little progress, one card at a time.</span><button class="upload-btn" id="uploadTop"><span>↑</span> Upload CSV</button><input id="fileInput" type="file" accept=".csv,text/csv" hidden></div></header>
<main><section class="hero"><div class="eyebrow">Your study space</div><h1>Make the next thing<br>you learn <span style="color:var(--green)">stick.</span></h1><p>Turn a simple spreadsheet into a focused little study session. Your cards stay right here in your browser.</p></section>
<section id="app" class="workspace"></section>
</main><footer class="footer"><span>Made for curious minds.</span><span>CSV stays on your device</span></footer>
</div><div class="drop-overlay" id="dropOverlay">Drop your CSV to get started</div><div class="toast" id="toast" role="status"></div>
<script>
(()=>{
const $=s=>document.querySelector(s), app=$('#app'), fileInput=$('#fileInput');let rows=[],headers=[],cards=[],index=0,flipped=false,deckName='Untitled deck',toastTimer;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseCSV(text){text=text.replace(/^\uFEFF/,'');const out=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"'&&cell==='')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));if(row.some(v=>v.trim()))out.push(row);row=[];cell=''}else cell+=c}row.push(cell.replace(/\r$/,''));if(row.some(v=>v.trim()))out.push(row);return out}
function showToast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function emptyView(){app.innerHTML=`<div class="empty"><div class="empty-icon">▤</div><h2>Your first deck starts here</h2><p>Upload a CSV with a question in one column and its answer in another. We’ll take it from there.</p><button class="primary" id="uploadMain">↑ &nbsp;Choose a CSV file</button><br><button class="sample-link" id="sampleBtn">Try a sample deck</button></div>`;$('#uploadMain').onclick=()=>fileInput.click();$('#sampleBtn').onclick=loadSample}
function setupView(){const opts=headers.map((h,i)=>`<option value="${i}">${escapeHTML(h||`Column ${i+1}`)}</option>`).join('');app.innerHTML=`<div class="setup"><h2>Set up your deck</h2><p>Pick which columns should appear on the front and back of each card.</p><div class="fields"><div class="field"><label for="qCol">QUESTION / FRONT</label><select id="qCol">${opts}</select></div><div class="field"><label for="aCol">ANSWER / BACK</label><select id="aCol">${opts}</select></div><div class="field"><label for="nameInput">DECK NAME</label><input id="nameInput" type="text" value="${escapeHTML(deckName)}" maxlength="50"></div></div><div class="setup-foot"><label class="checkbox"><input type="checkbox" id="hasHeader" checked> First row contains column names</label><button class="primary" id="makeDeck">Make my cards →</button></div></div>`;$('#makeDeck').onclick=buildDeck}
function loadCSV(text,name){const parsed=parseCSV(text);if(parsed.length<2){showToast('This CSV needs a header and at least one row.');return}headers=parsed[0].map((h,i)=>h.trim()||`Column ${i+1}`);rows=parsed.slice(1);deckName=name.replace(/\.csv$/i,'')||'My deck';setupView()}
function buildDeck(){const q=+$('#qCol').value,a=+$('#aCol').value,hasHeader=$('#hasHeader').checked;let data=parseCSV(window.rawCSV||'');if(!data.length)return;if(!hasHeader){headers=data[0].map((_,i)=>`Column ${i+1}`);rows=data}else rows=data.slice(1);cards=rows.map(r=>({q:(r[q]||'').trim(),a:(r[a]||'').trim()})).filter(c=>c.q||c.a);if(!cards.length){showToast('No cards found in those columns.');return}deckName=$('#nameInput').value.trim()||'My deck';index=0;flipped=false;render();showToast(`${cards.length} cards ready to study`)}
function render(){if(!cards.length){emptyView();return}const c=cards[index];app.innerHTML=`<div class="study-head"><div><div class="deck-name">${escapeHTML(deckName)}</div><div class="deck-meta">${cards.length} cards · Card ${index+1} of ${cards.length}</div></div><div class="actions"><button class="quiet-btn" id="shuffleBtn" title="Shuffle cards">⤨ Shuffle</button><button class="quiet-btn" id="newDeckBtn">＋ New deck</button></div></div><div class="progress-wrap"><div class="progress" style="width:${(index+1)/cards.length*100}%"></div></div><div class="card-scene${flipped?' flipped':''}" id="scene" tabindex="0" role="button" aria-label="Flashcard. Press space to flip."><div class="flashcard"><div class="face front"><div class="face-label">Question</div><div class="card-text">${escapeHTML(c.q||'—')}</div><div class="card-hint">Click or press space to reveal answer</div></div><div class="face back"><div class="face-label">Answer</div><div class="card-text">${escapeHTML(c.a||'—')}</div><div class="card-hint">Click or press space to return to question</div></div></div></div><div class="controls"><button class="arrow" id="prev" aria-label="Previous card" ${index===0?'disabled':''}>←</button><div class="counter">${index+1} <span style="color:#c2c3bc">/</span> ${cards.length}</div><button class="arrow" id="next" aria-label="Next card" ${index===cards.length-1?'disabled':''}>→</button></div><div class="kbd-hint"><span class="kbd">←</span><span class="kbd">→</span> navigate <span class="kbd">Space</span> flip</div>`;$('#scene').onclick=flip;$('#scene').onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}};$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#newDeckBtn').onclick=()=>{cards=[];window.rawCSV='';emptyView()};$('#shuffleBtn').onclick=shuffle}
function flip(){flipped=!flipped;$('#scene')?.classList.toggle('flipped',flipped)}function move(d){if(index+d<0||index+d>=cards.length)return;index+=d;flipped=false;render()}function shuffle(){for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]]}index=0;flipped=false;render();showToast('Cards shuffled')}
function loadSample(){headers=['Term','Definition'];rows=[['Photosynthesis','The process by which plants convert sunlight, water, and carbon dioxide into glucose and oxygen.'],['Mitosis','A type of cell division that produces two genetically identical daughter cells.'],['Osmosis','The movement of water molecules through a selectively permeable membrane from low to high solute concentration.'],['Homeostasis','The tendency of an organism to maintain a stable internal environment.']];window.rawCSV='Term,Definition\n'+rows.map(r=>r.map(x=>'"'+x.replaceAll('"','""')+'"').join(',')).join('\n');deckName='Biology basics';setupView()}
$('#uploadTop').onclick=()=>fileInput.click();fileInput.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{window.rawCSV=await f.text();loadCSV(window.rawCSV,f.name)}catch{showToast('Could not read that file.')}e.target.value=''};
document.addEventListener('keydown',e=>{if(!cards.length||['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.code==='Space'){e.preventDefault();flip()}});
let drag=0;document.addEventListener('dragenter',e=>{if(e.dataTransfer?.types.includes('Files')){$('#dropOverlay').classList.add('show');drag++}});document.addEventListener('dragleave',()=>{if(--drag<=0){drag=0;$('#dropOverlay').classList.remove('show')}});document.addEventListener('dragover',e=>{if(e.dataTransfer?.types.includes('Files'))e.preventDefault()});document.addEventListener('drop',async e=>{if(!e.dataTransfer?.files.length)return;e.preventDefault();drag=0;$('#dropOverlay').classList.remove('show');const f=e.dataTransfer.files[0];if(!f.name.toLowerCase().endsWith('.csv')){showToast('Please drop a .csv file.');return}window.rawCSV=await f.text();loadCSV(window.rawCSV,f.name)});
emptyView();
})();
</script>
</body>
</html>
