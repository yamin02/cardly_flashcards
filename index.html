<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f6f2">
<meta name="application-name" content="Cardly">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cardly">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon.ico" sizes="any">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" sizes="180x180">
<title>Cardly — study, one card at a time</title>
<style>
:root{--paper:#f7f6f2;--ink:#20231f;--muted:#777b72;--line:#e8e7df;--green:#375c4b;--lime:#d6ef83;--white:#fff;--shadow:0 24px 70px #252b2012}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1120px;margin:auto;padding:26px 42px 40px}.topbar{display:flex;align-items:center;justify-content:space-between;padding-bottom:24px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;font-weight:750;letter-spacing:-.04em;font-size:19px}.brand-mark{width:31px;height:31px;border-radius:10px;background:var(--green);display:grid;place-items:center;color:var(--lime);font-size:17px}.top-right{display:flex;align-items:center;gap:16px;color:var(--muted);font-size:13px}.upload-btn,.primary{border:0;background:var(--green);color:white;border-radius:11px;padding:11px 16px;font-weight:650;transition:.2s}.upload-btn:hover,.primary:hover{background:#294839;transform:translateY(-1px)}.upload-btn span{color:var(--lime);margin-right:6px}.hero{max-width:650px;margin:54px auto 34px;text-align:center}.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--green);font-weight:750}.hero h1{font-size:clamp(32px,5vw,48px);line-height:1.08;letter-spacing:-.055em;margin:12px 0}.hero p{color:var(--muted);margin:0 auto;max-width:480px}.workspace{max-width:790px;margin:auto}.study-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.deck-name{font-size:14px;font-weight:700}.deck-meta{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:8px}.quiet-btn{background:transparent;border:1px solid var(--line);border-radius:9px;padding:8px 11px;color:#54584f;font-size:12px;font-weight:600}.quiet-btn:hover{border-color:#b7baaf;background:#fff}.progress-wrap{height:4px;background:#e8e8e0;border-radius:4px;margin-bottom:19px;overflow:hidden}.progress{height:100%;background:var(--green);width:0%;transition:width .3s}.card-scene{perspective:1200px;min-height:345px;cursor:pointer;outline:none}.flashcard{position:relative;min-height:345px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.7,.2,1);border-radius:22px}.card-scene.flipped .flashcard{transform:rotateX(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);border-radius:22px;background:var(--white);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 75px}.back{transform:rotateX(180deg);background:#f1f4ed}.face-label{position:absolute;top:24px;left:28px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.13em;font-size:10px;font-weight:750;color:var(--muted)}.face-label:before{content:"";width:7px;height:7px;border-radius:50%;background:#a6aa9d}.back .face-label:before{background:var(--green)}.card-text{font-size:clamp(21px,3.4vw,31px);line-height:1.3;letter-spacing:-.035em;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere;max-height:210px;overflow:auto}.card-hint{position:absolute;bottom:22px;color:#9a9c94;font-size:11px}.controls{display:flex;align-items:center;justify-content:center;gap:19px;margin:19px 0 0}.arrow{width:43px;height:43px;border:1px solid var(--line);border-radius:50%;background:transparent;color:#454a43;font-size:19px;display:grid;place-items:center}.arrow:hover:not(:disabled){background:#fff;border-color:#c5c8bd}.arrow:disabled{opacity:.35;cursor:default}.counter{font-variant-numeric:tabular-nums;color:#777b72;font-size:13px;min-width:66px;text-align:center}.kbd-hint{text-align:center;color:#a0a198;font-size:11px;margin-top:24px}.kbd{display:inline-block;border:1px solid #d9d9d1;background:#fff;border-radius:4px;padding:0 5px;color:#73776d;font-size:10px;margin:0 2px}.drop-overlay{display:none;position:fixed;inset:16px;border:2px dashed var(--green);border-radius:20px;background:#f7f6f2ed;z-index:5;place-items:center;text-align:center;color:var(--green);font-size:24px;font-weight:700}.drop-overlay.show{display:grid}.empty{max-width:700px;margin:64px auto;padding:54px 34px;background:#fff;border:1px solid var(--line);border-radius:22px;text-align:center;box-shadow:var(--shadow)}.empty-icon{margin:0 auto 18px;width:58px;height:58px;border-radius:18px;background:#eef2e7;color:var(--green);display:grid;place-items:center;font-size:25px}.empty h2{font-size:24px;letter-spacing:-.04em;margin:0 0 8px}.empty p{color:var(--muted);max-width:410px;margin:0 auto 22px}.sample-link{border:0;background:none;color:var(--green);text-decoration:underline;text-underline-offset:3px;font-weight:600;margin-top:13px}.setup{max-width:590px;margin:32px auto;padding:27px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.setup h2{font-size:18px;margin:0 0 5px;letter-spacing:-.03em}.setup p{color:var(--muted);font-size:13px;margin:0 0 18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:11px;font-weight:700;color:#686d64;margin-bottom:5px}.field select,.field input[type=text]{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;color:var(--ink)}.setup-foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.checkbox{font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:center}.footer{max-width:790px;margin:58px auto 0;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:#9a9c94;font-size:11px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;transition:.2s;background:#20231f;color:#fff;border-radius:10px;padding:11px 16px;font-size:13px;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:650px){.shell{padding:18px 18px 30px}.topbar{padding-bottom:17px}.top-right .tagline{display:none}.hero{margin:40px auto 27px}.face{padding:43px 25px}.card-scene,.flashcard{min-height:330px}.study-head{align-items:flex-start;gap:12px}.actions{gap:5px}.quiet-btn{padding:7px 8px}.footer{margin-top:42px}.fields{grid-template-columns:1fr}.setup{padding:22px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
/* Keep the study card in the available viewport; its contents scroll as needed. */
.shell{height:100vh;height:100dvh;min-height:320px;display:flex;flex-direction:column;padding:18px 42px 12px}
.topbar{flex:none;padding-bottom:14px}
main{flex:1;min-height:0;display:flex;padding-top:18px}
.workspace{width:100%;min-height:0;margin:0 auto;display:flex;flex-direction:column}
.study-head{flex:none;gap:12px;margin-bottom:10px}
.study-head>div:first-child{min-width:0}
.progress-wrap{flex:none;margin-bottom:12px}
.anki-card{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:white;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:46px 12px 10px;overflow:hidden}
.anki-card iframe{width:100%;height:100%;flex:1;min-height:0;border:0;display:block}
.anki-card .face-label{top:18px}
.deck-name{overflow-wrap:anywhere}
.controls{flex:none;flex-wrap:wrap;margin-top:12px}
.kbd-hint{flex:none;margin-top:8px}
.footer{flex:none;width:100%;margin:10px auto 0;padding-top:8px}
@media(max-width:650px){.shell{padding:12px 12px 8px}.topbar{padding-bottom:10px}main{padding-top:12px}.controls{gap:10px}.deck-name{font-size:12px}.anki-card{padding:42px 4px 6px}.kbd-hint{font-size:10px}.footer{font-size:10px}}
@media(max-height:550px){.footer,.kbd-hint{display:none}.shell{padding-top:8px;padding-bottom:8px}.topbar{padding-bottom:8px}main{padding-top:8px}.study-head{margin-bottom:6px}.progress-wrap{margin-bottom:8px}.controls{margin-top:8px}}
.study-head{flex-wrap:wrap;align-items:center}
.study-title{flex:1}
.study-filters{display:flex;gap:6px;flex-basis:100%;flex-wrap:wrap}
.filter-btn,.rating-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-size:12px;font-weight:650;color:#54584f}
.filter-btn span{margin-left:5px;font-variant-numeric:tabular-nums;opacity:.7}
.hard{--rating-color:#9c4b30;--rating-bg:#fff0e8}
.good{--rating-color:#375c4b;--rating-bg:#edf4e7}
.easy{--rating-color:#326882;--rating-bg:#eaf4fa}
.filter-btn[aria-pressed=true]{background:var(--rating-bg,#e9eddf);border-color:var(--rating-color,#375c4b);color:var(--rating-color,#375c4b)}
.rating-btn{color:var(--rating-color);background:var(--rating-bg)}
.rating-btn[aria-pressed=true]{border-color:var(--rating-color);box-shadow:0 0 0 1px var(--rating-color)}
.rating-controls{display:flex;gap:6px}
.controls{margin:0 0 12px;gap:12px}
.empty-selection{align-items:center;justify-content:center;padding:24px;text-align:center}
.empty-selection h2{font-size:20px;margin:0 0 8px}
.empty-selection p{color:var(--muted)}
@media(max-width:650px){.controls{gap:8px}.rating-controls{flex-basis:100%;justify-content:center}.filter-btn{flex:1;padding:6px 8px}.rating-btn{padding:7px 18px}.study-head{gap:8px}.deck-meta{font-size:11px}}
@media(max-height:550px){.study-head{gap:5px}.controls{margin:0 0 8px}.filter-btn,.rating-btn{padding:4px 10px}.progress-wrap{margin-bottom:6px}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar"><div class="brand"><div class="brand-mark">✳</div>cardly</div><div class="top-right"><span class="tagline">A little progress, one card at a time.</span><button class="upload-btn" id="uploadTop"><span>↑</span> Import Anki deck</button><input id="fileInput" type="file" accept=".apkg,.colpkg,application/zip" hidden></div></header>
<main>
<section id="app" class="workspace"></section>
</main><footer class="footer"><span>Made for curious minds.</span><span>Your decks stay on your device</span></footer>
</div><div class="drop-overlay" id="dropOverlay">Drop your Anki deck to get started</div><div class="toast" id="toast" role="status"></div>
<script src="vendor/fflate.js"></script>
<script src="vendor/sql-asm.js"></script>
<script src="anatomy-deck.js"></script>
<script src="flashcards.js"></script>
</body></html>
